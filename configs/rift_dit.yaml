# ============================================================
# usvc 训练配置: RIFT-SVC (Rectified Flow + DiT)
# ============================================================
# 对应原项目: RIFT-SVC (github.com/yxlllc/RIFT-SVC)
# 原项目配置: config/finetune.yaml + config/model/dit-*.yaml
#
# RIFT-SVC 原项目有 4 种 DiT 尺寸, usvc 通过 backend_opts 的 dim/depth 切换:
#   DiT-512-8  (默认, 对应 dit-512-8.yaml):   dim=512,  depth=8
#   DiT-768-12 (对应 dit-768-12.yaml):        dim=768,  depth=12
#   DiT-1024-16 (对应 dit-1024-16.yaml):      dim=1024, depth=16
#   DiT-base   (对应 dit-base.yaml):          dim=768,  depth=12, head_dim=64
# 预训练(pretrain.yaml)与微调(finetune.yaml)差别仅在 lr/步数, 本配置为微调版
# ============================================================

backend: rift_dit
dataset_dir: data/my_dataset       # 必填: 预处理后的数据集目录 (含 meta.json)
exp_dir: experiments/rift_dit      # 输出目录 (checkpoint/log)

# ---- 训练超参 (对应原项目 training 段) ----
batch_size: 64                     # [可调] RIFT-SVC 默认 64; A10G 24GB 安全上限
max_frames: 256                    # [可调] 训练片段长度(帧), 对应 max_frame_len
num_workers: 8                     # [可调] dataloader worker 数
max_steps: 10000                   # [可调] 微调典型步数; 预训练建议 >= 100000
val_interval: 1000                 # [可调] 验证间隔(步)
save_interval: 1000                # [可调] checkpoint 保存间隔(步)
precision: bf16-mixed              # [可调] bf16 AMP (已验证近无损, 见 THROUGHPUT_REPORT)

# ---- 优化器 (RIFT-SVC 默认 schedulefree) ----
optimizer:
  type: schedulefree               # [可调] schedulefree | adamw
  lr: 0.0001                       # [可调] 原项目默认 1e-4
  betas: [0.9, 0.95]               # [可调] 原项目默认 (0.9, 0.95)
  weight_decay: 0.01               # [可调] 原项目默认 0.01
schedule:
  type: linear_warmup_decay        # [可调] None | step | exponential | linear_warmup_decay
  warmup_steps: 500                # [可调] 原项目 warmup_ratio=0.05 * max_steps

grad_clip: 1.0                     # [可调] 梯度裁剪; None 关闭

# ---- 模型架构 (对应原项目 model yaml) ----
backend_opts:
  dim: 512                         # [可调] DiT 隐藏维度: 512/768/1024 (见顶部尺寸表)
  depth: 8                         # [可调] DiT 层数: 8/12/16
  head_dim: 64                     # [可调] 注意力头维度 (原项目默认 64)
  dropout: 0.0                     # [可调] dropout 率
  ff_mult: 4                       # [可调] FFN 隐藏倍数 (原项目默认 4)
  kernel_size: 3                   # [可调] 卷积核大小 (原项目默认 3)
  time_schedule: lognorm           # [可调] 时间步分布: lognorm (原项目默认)
  loss_type: l2                    # [可调] flow 损失: l2 (默认)
  zero_null_spk: true              # [可调] 空说话人嵌入置零
  n_mel_channels: 128              # mel bins (数据决定, 与特征配置一致, 勿改)
  num_speaker: 1                   # [可调] 说话人数 (多说话人改此值)
  cvec_dim: 256                    # [可调] 内容编码器维度: 256 (hubertsoft) / 768 (contentvec)
                                   #       注意: 默认 256, 用 contentvec 数据需设 768
  drop_spk_prob: 0.0               # [可调] 说话人随机丢弃概率 (原项目 drop_spk_prob)
  eval_sample_steps: 50            # [可调] 验证采样步数

# ---- 特征编码器覆盖 (可选, 默认 contentvec) ----
# units_kind: hubertsoft           # 取消注释切换为 hubertsoft (需同时 cvec_dim: 256)
# f0_extractor: fcpe               # [可调] rmvpe(默认) | fcpe (更快)

# ---- 预训练权重加载 (微调时) ----
# pretrained: pretrain/rift_dit_base.pt   # 取消注释加载预训练权重
