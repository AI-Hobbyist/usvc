# DDSP-SVC 6.5: dual-timestep rectified flow + RMSNorm + SoftSign GLU.
# PyTorch backend. 6.1-6.3 checkpoints are incompatible with this architecture.
# Preprocess with this same config so pitch-augmented features are registered:
#   usvc-preprocess run data/my_dataset --backend ddsp6 --train-cfg configs/ddsp65.yaml
# Train:
#   usvc-train --config configs/ddsp65.yaml
backend: ddsp6
dataset_dir: data/my_dataset
exp_dir: experiments/ddsp65

batch_size: 48             # Reduce for GPUs with limited VRAM.
max_frames: 172            # Approximately 2 seconds at 44100 Hz / hop 512.
num_workers: 2
max_steps: 500000
val_interval: 2000
save_interval: 2000
limit_val_batches: 1
keep_last_n: 5
precision: bf16-mixed
# Neural layers use BF16; spectral synthesis stays FP32 to avoid BComplex32.
grad_clip: 1.0

# This template uses AdamW. Upstream 6.5 uses its own Muon+AdamW implementation.
# usvc also accepts muon_adamw (optional external Muon); it is not asserted to
# reproduce the upstream optimizer's parameter grouping or fused Gram-NS path.
optimizer:
  type: adamw
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.1
schedule:
  type: step
  decay_step: 4000
  gamma: 0.9

backend_opts:
  version: "6.5"
  glu_type: softsign_glu    # atanglu | softsign_glu | double_softsign_glu
  n_aux_layers: 6
  n_aux_chans: 512
  n_layers: 6
  n_chans: 1024
  t_start: 0.0
  use_pitch_aug: true
  num_speaker: 1           # usvc speaker IDs start at 0.
  n_units: 768             # contentvec_tta2x by default; hubertsoft requires 256.
  compile_velocity: false # Optional torch.compile; no upstream fused-kernel dependency.

# Matches the reference 6.5 pitch extractor; install the RMVPE weights first.
f0_extractor: rmvpe
rmvpe_ckpt: pretrained/rmvpe/model.pt
