# ============================================================
# usvc 训练配置: RIFT-SVC 微调 (基于预训练底模)
# ============================================================
# 对应原项目: RIFT-SVC config/finetune.yaml
# 场景: 加载预训练底模, 在目标说话人数据上微调
#
# RIFT-SVC 原项目有 4 种 DiT 尺寸, usvc 通过 backend_opts 的 dim/depth 切换:
#   DiT-512-8  (默认, 对应 dit-512-8.yaml):   dim=512,  depth=8
#   DiT-768-12 (对应 dit-768-12.yaml):        dim=768,  depth=12
#   DiT-1024-16 (对应 dit-1024-16.yaml):      dim=1024, depth=16
#   DiT-base   (对应 dit-base.yaml):          dim=768,  depth=12, head_dim=64
# ============================================================

backend: rift_dit
dataset_dir: data/finetune         # 必填: 预处理后的数据集目录 (含 meta.json)
exp_dir: experiments/rift_dit_finetune  # 输出目录 (checkpoint/log)

# ---- 训练超参 (原项目 finetune.yaml) ----
batch_size: 64                     # [可调] RIFT-SVC 默认 64; A10G 24GB 安全上限
max_frames: 256                    # [可调] 训练片段长度(帧), 对应 max_frame_len
num_workers: 4                     # [可调] 数据加载进程数
max_steps: 10000                   # [可调] 原项目微调默认 10000
val_interval: 1000                 # [可调] 原项目 test_per_steps=1000
save_interval: 1000                # [可调] 原项目 save_per_steps=1000
limit_val_batches: 0               # 跳过验证 (sample 慢; 开启设 1.0)
keep_last_n: 5                     # 保留最近 N 个 checkpoint + last (-1 = 全保留)
precision: bf16-mixed              # [可调] bf16 AMP (已验证近无损)

# ---- 优化器 (原项目 finetune: adamwsf, lr=1e-4) ----
optimizer:
  type: schedulefree               # [可调] schedulefree | adamw (原项目 optimizer_type: adamwsf)
  lr: 0.0001                       # [可调] 原项目微调默认 1e-4
  betas: [0.9, 0.95]               # [可调] 原项目默认 (0.9, 0.95)
  weight_decay: 0.01               # [可调] 原项目默认 0.01
schedule:
  type: linear_warmup_decay        # [可调] None | step | exponential | linear_warmup_decay
  warmup_steps: 500                # [可调] 原项目 warmup_ratio=0.05 * 10000 = 500

grad_clip: 1.0                     # [可调] 梯度裁剪; None 关闭

# ---- 模型架构 (对应原项目 model yaml; 必须与预训练底模一致) ----
backend_opts:
  dim: 512                         # [可调] DiT 隐藏维度: 512/768/1024 (见顶部尺寸表)
  depth: 8                         # [可调] DiT 层数: 8/12/16
  head_dim: 64                     # [可调] 注意力头维度 (原项目默认 64)
  dropout: 0.0                     # [可调] dropout 率
  ff_mult: 4                       # [可调] FFN 隐藏倍数 (原项目默认 4)
  kernel_size: 31                  # [可调] DiT ConvMLP depthwise 核大小 (原项目 dit-base 默认 31)
  time_schedule: lognorm           # [可调] 时间步分布: lognorm (原项目默认)
  loss_type: l2                    # [可调] flow 损失: l2 (默认)
  zero_null_spk: false             # [可调] 空说话人嵌入可学习 (原项目默认 false)
  n_mel_channels: 128              # mel bins (数据决定, 与特征配置一致, 勿改)
  num_speaker: 1                   # [可调] 说话人数 (多说话人改此值)
  cvec_dim: 768                    # [可调] 内容编码器维度: 768 (contentvec, 默认) / 256 (hubertsoft)
                                   #       注意: 默认特征编码器是 contentvec(768 维), 故默认 768;
                                   #       切换为 hubertsoft 时需同时设 units_kind: hubertsoft 并把此项改 256
  drop_spk_prob: 0.0               # 原项目微调默认 0.0 (底模已学 CFG 无条件分支, 微调时关闭)
  eval_sample_steps: 50            # [可调] 验证采样步数
  # ---- 推理 CFG (classifier-free guidance, RIFT-SVC 默认值) ----
  ds_cfg_strength: 0.2             # [可调] 内容(units) CFG 强度 (原项目默认 0.2)
  spk_cfg_strength: 0.8            # [可调] 说话人 CFG 强度 (原项目默认 0.8)
  skip_cfg_strength: 0.0           # [可调] skip-layer CFG 强度 (原项目默认 0.0)
  cfg_rescale: 0.7                 # [可调] CFG rescale 系数 (原项目默认 0.7)

# ---- 特征编码器覆盖 (可选, 默认 contentvec) ----
# units_kind: hubertsoft           # 取消注释切换为 hubertsoft (需同时 cvec_dim: 256)
# f0_extractor: fcpe               # [可调] rmvpe(默认) | fcpe (更快)

# ---- 预训练权重加载 (微调必须) ----
pretrained: experiments/rift_dit_pretrain/last.ckpt  # 指向预训练产出的 checkpoint
