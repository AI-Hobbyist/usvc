[project]
name = "usvc"
version = "0.1.0"
description = "Unified SVC framework: shared preprocessing, pluggable backends, single training/inference pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "torch>=2.4",
    "librosa>=0.10",
    "soxr>=0.3",            # librosa resample backend (soxr_hq/soxr_lq used in io/audio.py)
    "soundfile>=0.12",
    "einops>=0.8",          # FCPE + (later) DiT models
    "local-attention>=1.11",# FCPE core mechanism (local windowed attention)
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "lightning>=2.4",        # unified training framework (all backends)
    "schedulefree>=1.4",    # AdamWScheduleFree (rift_dit default optimizer)
    "x-transformers>=2.0",  # RotaryEmbedding (rift_dit DiT)
    # triton: torch.compile 后端 + 手写 _triton/ kernel。
    # Linux 上 CUDA 版 torch 自动带 triton，这里显式声明保证 torch.compile 可用。
    # Windows 无官方 triton wheel，用 environment marker 跳过（见 [gui] extra + _compat.py fallback）。
    "triton>=3.1; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Training stack: lightning + schedulefree optimizer
train = [
    "lightning>=2.4",
    "schedulefree>=1.4",
    "tensorboard>=2.15",
]
# Windows: 官方 triton 无 Windows wheel，装 triton-windows（版本需与 torch 严格对应）。
# 用法（Windows）: pip install usvc[gui]  （或单独 pip install triton-windows）
# 对应关系: torch 2.4/2.5→triton 3.1, 2.6→3.2, 2.7→3.3, 2.8→3.4, 2.9→3.5, 2.10→3.6
gui = [
    "triton-windows>=3.1; sys_platform == 'win32'",
]
# WebUI/桌面端（usvc-studio）本地 API 服务
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
usvc-preprocess = "usvc.cli.preprocess:main"
usvc-train = "usvc.cli.train:main"
usvc-infer = "usvc.cli.infer:main"
usvc-export = "usvc.cli.export:main"
usvc-profile = "usvc.cli.profile:main"
usvc-index = "usvc.retrieval.cli:main_index"
usvc-cluster = "usvc.retrieval.cli:main_cluster"
usvc-checkenv = "usvc._envcheck:main"
usvc-serve = "usvc.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usvc"]
exclude = [
    "usvc/features/fcpe/assets",  # 42MB FCPE weight — download separately
]

[tool.hatch.build.targets.sdist]
exclude = [
    "AGENTS.md",      # 本地 agent 约束（含硬件/路径信息，不发布）
    ".pi-subagents",  # pi agent 会话产物
]

[tool.uv]
# torch 通过 PyTorch index 安装(见 [[tool.uv.index]])
